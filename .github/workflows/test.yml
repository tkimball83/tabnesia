name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # web-ext packages everything not in ignoreFiles; fail on anything new.
      - name: Package contains only the extension's files
        run: |
          diff <(unzip -Z1 web-ext-artifacts/*.zip | grep -v '/$' | sort) - <<'FILES'
          _locales/en/messages.json
          background.mjs
          config.mjs
          icons/tabnesia.svg
          manifest.json
          options.css
          options.html
          options.mjs
          FILES
