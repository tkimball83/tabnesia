<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Tabnesia settings</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Tabnesia</h1>
      <p>These URLs are pinned in this order in every Firefox window.</p>

      <form id="settings" inert>
        <ol id="pins" role="list" aria-label="Pinned URLs"></ol>
        <button id="add" type="button">Add URL</button>

        <label class="private-setting">
          <input id="private-windows" type="checkbox">
          Enable pins in Private Windows
        </label>
        <p id="private-help" class="help" hidden>
          First enable “Run in Private Windows” for tabnesia in Firefox’s
          Add-ons Manager, then reopen this page.
        </p>

        <div class="actions">
          <button type="submit">Save</button>
          <button id="export" type="button">Export backup</button>
          <input id="import" class="visually-hidden" type="file"
            accept="application/json,.json">
          <label class="button" for="import">Import backup</label>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">Loading…</p>
      <p id="external-change" class="help" role="status" hidden>
        Settings changed elsewhere — reload this page before saving.
      </p>
    </main>

    <template id="row-template">
      <li class="pin">
        <span class="drag" draggable="true" title="Drag to reorder"
          aria-hidden="true">⠿</span>
        <input class="url" type="url" inputmode="url"
          placeholder="https://example.com/" aria-label="Pinned URL"
          required spellcheck="false">
        <button class="up" type="button" aria-label="Move up">↑</button>
        <button class="down" type="button" aria-label="Move down">↓</button>
        <button class="remove" type="button" aria-label="Remove URL">
          Remove
        </button>
      </li>
    </template>
    <script type="module" src="options.mjs"></script>
  </body>
</html>
